performance_requirements:
  - Privacy filtering: < 1 second for 1000 engrams
  - PII scanning: < 2 seconds for 1000 engrams
  - SIF compression: < 3 seconds for 1000 engrams
  - Encryption: < 1 second for 100 KB
  - Signature: < 100ms
  - Total workflow: < 10 seconds
  - Memory overhead: < 100 MB

security_considerations:
  - Use NaCl Box (Curve25519 + XSalsa20 + Poly1305) for encryption
  - Use Ed25519 for signatures
  - Generate fresh nonce for each encryption
  - Verify signatures before decryption
  - Check content hash after decryption
  - Scan for malicious content before import
  - Rate-limit export operations (prevent data exfiltration)
  - Log all exports (audit trail)
  - Require user confirmation for exports
  - Warn about irreversible sharing

privacy_levels:
  - Public: No encryption, anyone can read
  - Selective: Privacy filters applied, PII removed
  - Encrypted: Encrypted for specific recipient(s)
  - Private: Never exported, local only

trust_model:
  - Web of trust (signatures from known Angels)
  - Reputation scores (based on past interactions)
  - Verification chains (transitive trust)
  - Revocation lists (compromised keys)
  - Time-limited trust (expire after N days)

future_enhancements:
  - Multi-recipient encryption (group sharing)
  - Selective disclosure (zero-knowledge proofs)
  - Homomorphic encryption (compute on encrypted data)
  - Differential privacy (add noise to preserve privacy)
  - Federated learning (train on distributed data)
  - Conflict resolution (merge divergent knowledge)
  - Version control (track knowledge evolution)
  - Rollback (undo exports if needed)
